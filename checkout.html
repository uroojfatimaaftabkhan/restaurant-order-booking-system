<section class="py-5">
<div class="container">
<h2 class="text-center page-title">Checkout</h2>

<div class="row g-4">

<div class="col-lg-7">
<div class="order-box">
<h5 class="mb-4">Delivery Details</h5>

<form id="orderForm">
<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" id="customerName" required>
</div>

<div class="mb-3">
<label class="form-label">Phone Number</label>
<input type="tel" class="form-control" id="customerPhone" required>
</div>

<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" id="customerEmail" required>
</div>

<div class="mb-3">
<label class="form-label">Address</label>
<textarea class="form-control" id="customerAddress" rows="3" required></textarea>
</div>

<div class="payment-box mb-4">
<strong>Payment Method</strong>
<div class="form-check mt-2">
<input class="form-check-input" type="radio" checked>
<label class="form-check-label">
Cash on Delivery
</label>
</div>
</div>

<button type="submit" class="btn btn-order w-100 btn-lg">
Place Order
</button>
</form>
</div>
</div>

<div class="col-lg-5">
<div class="order-box">
<h5 class="mb-4">Order Summary</h5>
<div id="orderItems"></div>
<hr>
<div class="total-box d-flex justify-content-between">
<span>Total</span>
<span id="orderTotal">$0</span>
</div>
</div>
</div>

</div>
</div>
</section>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

const itemsContainer = document.getElementById("orderItems");
const totalElement = document.getElementById("orderTotal");

let total = 0;

// Display cart items
cart.forEach(item=>{
    let subtotal = item.price * item.quantity;
    total += subtotal;
    itemsContainer.innerHTML += `
        <div class="order-item">
            <div>
                <strong>${item.name}</strong><br>
                <small>$${item.price} x ${item.quantity}</small>
            </div>
            <div>$${subtotal.toFixed(2)}</div>
        </div>
    `;
});

totalElement.innerText = "$"+total.toFixed(2);

document.getElementById("orderForm").addEventListener("submit", function(e){
    e.preventDefault();

    if(cart.length === 0){
        alert("Your cart is empty!");
        return;
    }

    const name = document.getElementById("customerName").value;
    const phone = document.getElementById("customerPhone").value;
    const address = document.getElementById("customerAddress").value;

    // Convert cart array into HTML string
    const cartItemsString = cart.map(item => {
        return `${item.name} - $${item.price} x ${item.quantity} = $${(item.price * item.quantity).toFixed(2)}`;
    }).join("<br>");

    // Build email parameters matching template_oadc41r
    const templateParams = {
        from_name: name,
        from_email: document.getElementById("customerEmail").value,
        from_phone: phone,
        address: address,
        items: cartItemsString,
        total: total.toFixed(2)
    };
    emailjs.send("service_mvzpyde", "template_oadc41r", templateParams)
        .then(function () {
            alert('Order placed successfully! We will contact you soon.');
            localStorage.removeItem("cart");
            window.location.href = "index.html";
        })
        .catch(function (error) {
            console.error("FAILED!", error);
            alert('Failed to send order. Please try again.');
        });
});
</script>
